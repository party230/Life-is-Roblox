<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
@font-face { font-family: Fredoka; src: url(../fonts/Fredoka-VF.ttf); font-weight: 300 700; }
@font-face { font-family: Nunito; src: url(../fonts/Nunito-VF.ttf); font-weight: 200 1000; }
:root { --ink: #1B1530; --panel: #FFF8EC; --yellow: #FFD23F; --green: #3DDC84; --blue: #4DA3FF; --pink: #FF5C8A; --orange: #FF8A3D; --purple: #8B5CF6; --red: #FF4D4D; }
* { box-sizing: border-box; }
body { margin: 0; width: 2000px; height: 900px; background: #F2EEE6; font-family: Nunito, sans-serif; color: var(--ink); position: relative; }
.head { position: absolute; left: 44px; top: 24px; }
.head .brand { font: 700 30px Fredoka; color: var(--pink); letter-spacing: 1px; margin-right: 16px; }
.head .t { font: 700 40px Fredoka; }
.head .s { font: 600 20px Nunito; color: #5b5568; margin-top: 4px; }
.phone { position: absolute; left: 24px; top: 108px; width: 1400px; height: 660px; border-radius: 60px; background: #1d1b26; padding: 22px; box-shadow: 0 14px 0 #c9c3b8; }
#screen { position: relative; width: 100%; height: 100%; border-radius: 40px; overflow: hidden; background-size: cover; background-position: center; }
#screen::before { content: ""; position: absolute; inset: -10px; background-size: cover; background-position: center; filter: blur(3px); }
#screen.bg-hub::before { background-image: url(../../../assets/mockups/v3/design-hub-close.png); }
#screen.bg-nursery::before { background-image: url(../../../assets/mockups/v3/design-nursery-interior.png); }
.notesbox { position: absolute; left: 1450px; top: 120px; width: 520px; min-height: 640px; background: #fff; border: 3px solid #E6DFD2; border-radius: 26px; padding: 22px 24px; }
.notesbox h3 { font: 700 26px Fredoka; margin: 0 0 16px; }
.note { display: flex; gap: 12px; margin-bottom: 16px; font: 600 17px/1.35 Nunito; }
.tag { flex: none; background: var(--blue); color: #fff; border-radius: 8px; padding: 2px 8px; font: 700 14px Fredoka; height: 22px; }
.tag.q { background: var(--pink); }
/* HUD */
.hud { position: absolute; left: 22px; top: 18px; right: 22px; height: 70px; }
.hud .cash { position: absolute; left: 0; top: 0; background: #fff; border: 4px solid var(--ink); border-radius: 30px; padding: 4px 26px 4px 8px; font: 700 28px Fredoka; display: flex; align-items: center; gap: 10px; }
.coin { width: 36px; height: 36px; border-radius: 50%; background: var(--yellow); border: 3px solid var(--ink); display: inline-flex; align-items: center; justify-content: center; font-size: 20px; }
.hud .ips { position: absolute; left: 14px; top: 52px; background: var(--green); border: 3px solid var(--ink); border-radius: 20px; padding: 0 14px; font: 700 18px Fredoka; color: #fff; -webkit-text-stroke: 1px var(--ink); }
.hud .phase { position: absolute; left: 50%; transform: translateX(-50%); top: 0; background: #fff; border: 4px solid var(--ink); border-radius: 30px; padding: 4px 26px; font: 700 26px Fredoka; display: flex; gap: 12px; align-items: center; }
.sun { width: 26px; height: 26px; background: var(--yellow); border-radius: 50%; border: 3px solid var(--ink); }
/* Panel */
.panel { position: absolute; left: 50%; top: 100px; transform: translateX(-50%); width: 1180px; height: 512px; background: var(--panel); border: 5px solid var(--ink); border-radius: 30px; padding: 46px 26px 18px; box-shadow: 0 8px 0 rgba(0,0,0,.25); }
.panel.dialog { width: 640px; height: 420px; top: 130px; }
.banner { position: absolute; left: 50%; top: -34px; transform: translateX(-50%); padding: 6px 60px; border: 5px solid var(--ink); border-radius: 18px; font: 700 34px Fredoka; color: #fff; -webkit-text-stroke: 2px var(--ink); paint-order: stroke fill; box-shadow: 0 5px 0 rgba(0,0,0,.25); white-space: nowrap; }
.banner.orange { background: var(--orange); }
.banner.pink { background: var(--pink); }
.close { position: absolute; right: -24px; top: -26px; width: 60px; height: 60px; border-radius: 50%; background: var(--red); border: 5px solid #fff; outline: 4px solid var(--ink); color: #fff; font: 700 30px Fredoka; display: flex; align-items: center; justify-content: center; }
.row { display: flex; justify-content: space-between; align-items: center; }
.tabs { display: flex; gap: 10px; }
.tab { font: 700 20px Fredoka; padding: 6px 20px; border: 4px solid var(--ink); border-radius: 16px; background: #fff; display: inline-flex; gap: 6px; align-items: center; }
.tab.on { background: var(--yellow); }
.tab.prem { background: #E7FCEF; }
.tab.prem.on { background: var(--green); color: #fff; -webkit-text-stroke: 1px var(--ink); }
.qty { display: flex; border: 4px solid var(--ink); border-radius: 16px; overflow: hidden; }
.qty span { font: 700 20px Fredoka; padding: 4px 16px; background: #fff; border-left: 3px solid var(--ink); }
.qty span:first-child { border-left: none; }
.qty span.on { background: var(--blue); color: #fff; -webkit-text-stroke: 1px var(--ink); }
.grid { display: grid; gap: 14px; margin-top: 14px; }
.grid.n5 { grid-template-columns: repeat(5, 1fr); }
.grid.n4 { grid-template-columns: repeat(4, 1fr); }
.card { background: #fff; border: 4px solid var(--ink); border-radius: 22px; padding: 8px 10px 10px; display: flex; flex-direction: column; align-items: center; height: 318px; }
.art { width: 86px; height: 86px; }
.icon { width: 100%; height: 100%; }
.card .name { font: 700 20px Fredoka; text-align: center; margin: 4px 0 6px; line-height: 1.1; min-height: 44px; display: flex; align-items: center; }
.stats { display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; }
.stat { font: 800 13px Nunito; padding: 1px 6px; border-radius: 10px; border: 2px solid var(--ink); display: inline-flex; gap: 4px; align-items: center; }
.stat b { font-weight: 900; }
.stat.time { background: #E1F0FF; }
.stat.love { background: #FFE1EA; color: #C2185B; }
.stat.grow { background: #E7FCEF; color: #1B7F45; }
.buys { margin-top: auto; width: 100%; display: flex; flex-direction: column; gap: 6px; }
.buy { width: 100%; border: 4px solid var(--ink); border-radius: 16px; font: 700 22px Fredoka; color: #fff; -webkit-text-stroke: 1px var(--ink); padding: 4px 0; display: flex; justify-content: center; align-items: center; gap: 6px; box-shadow: inset 0 -5px 0 rgba(0,0,0,.18); }
.buy.cash { background: var(--green); }
.buy.robux { background: #24B36B; }
.buy.small { font-size: 16px; padding: 2px 10px; width: auto; }
.buy.big { font-size: 26px; padding: 10px 26px; width: auto; }
.rbx { width: 22px; height: 22px; color: #fff; }
.tab .rbx { color: var(--ink); width: 18px; height: 18px; }
.tab.prem.on .rbx { color: #fff; }
.inv { margin-top: 10px; display: flex; align-items: center; gap: 10px; background: #F4ECDD; border-radius: 18px; padding: 6px 14px; }
.inv-title { font: 700 18px Fredoka; }
.chip { display: inline-flex; align-items: center; gap: 2px; background: #fff; border: 3px solid var(--ink); border-radius: 14px; padding: 0 10px 0 2px; height: 40px; font: 800 16px Nunito; }
.chip .icon { width: 34px; height: 34px; }
.inv-hint { margin-left: auto; font: 700 15px Nunito; color: #6B7285; }
/* nursery */
.cols { display: flex; gap: 22px; height: 100%; }
.left { width: 470px; }
.sec { font: 700 22px Fredoka; display: flex; justify-content: space-between; margin-bottom: 8px; }
.muted { color: #6B7285; font-weight: 700; font-size: 15px; }
.incs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.inc { background: #fff; border: 4px solid var(--ink); border-radius: 18px; height: 104px; display: flex; align-items: center; gap: 10px; padding: 8px; }
.inc.ready { border-color: #2BB673; box-shadow: 0 0 0 4px #BDF5D3; }
.inc.sel { border-color: var(--pink); box-shadow: 0 0 0 4px #FFD0DE; }
.inc.locked { background: #ECE7DE; border-style: dashed; }
.inc-body { display: flex; flex-direction: column; gap: 4px; font: 700 16px Fredoka; flex: 1; min-width: 0; }
.egg { width: 56px; height: 72px; border-radius: 50% 50% 46% 46% / 58% 58% 42% 42%; background: var(--c); border: 4px solid var(--ink); flex: none; }
.baby { width: 70px; height: 70px; flex: none; }
.lock { font-size: 34px; width: 60px; text-align: center; }
.hatch { background: var(--yellow); border: 4px solid var(--ink); border-radius: 14px; font: 700 20px Fredoka; color: #fff; -webkit-text-stroke: 1px var(--ink); padding: 2px; }
.bar { position: relative; height: 22px; background: #E8E1D3; border: 3px solid var(--ink); border-radius: 12px; overflow: hidden; }
.bar > div { height: 100%; background: var(--blue); }
.bar.small { height: 16px; }
.bar.grow > div { background: var(--green); }
.bar.love > div { background: var(--pink); }
.bar span { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font: 800 13px Nunito; }
.hint { margin-top: 10px; font: 700 15px Nunito; color: #6B7285; }
.right { flex: 1; background: #fff; border: 4px solid var(--ink); border-radius: 22px; padding: 14px 18px; display: flex; flex-direction: column; gap: 10px; }
.who { display: flex; gap: 14px; align-items: center; }
.portrait { width: 74px; height: 74px; background: #FFF1D6; border: 3px solid var(--ink); border-radius: 16px; }
.bname { font: 700 26px Fredoka; }
.chips { display: flex; gap: 6px; margin-top: 2px; }
.rar { font: 700 15px Fredoka; padding: 1px 10px; border-radius: 10px; border: 3px solid var(--ink); color: #fff; -webkit-text-stroke: .6px var(--ink); }
.rar.mythic { background: #FF466E; }
.rar.stage { background: #7CE0FF; }
.income { font: 700 16px Fredoka; color: #2BB673; padding: 2px 6px; }
.stages { display: flex; align-items: center; gap: 6px; }
.stage { flex: 1; border: 3px solid var(--ink); border-radius: 14px; text-align: center; padding: 2px 0; background: #F4ECDD; font: 700 18px Fredoka; display: flex; flex-direction: column; }
.stage small { font: 700 12px Nunito; color: #6B7285; }
.stage.on { background: #7CE0FF; }
.arrow { font: 700 26px Fredoka; }
.owner { background: #FFF1F5; border: 3px dashed #FF8FB0; border-radius: 16px; padding: 8px 12px; display: flex; flex-direction: column; gap: 6px; }
.orow { display: flex; align-items: center; gap: 10px; font: 700 16px Fredoka; }
.olabel { width: 136px; }
.orow .bar { flex: 1; }
.oval { font: 800 14px Nunito; }
.timer { background: #14121C; color: #fff; border-radius: 12px; padding: 0 12px; font: 700 18px Fredoka; }
.small-note { margin-left: auto; font-size: 13px; }
.feed { display: flex; gap: 10px; align-items: center; }
.pick { display: flex; align-items: center; gap: 6px; border: 3px solid var(--ink); border-radius: 14px; padding: 2px 10px 2px 2px; background: #fff; font: 700 16px Fredoka; }
.pick .icon { width: 44px; height: 44px; }
.pick div { display: flex; flex-direction: column; }
.pick .muted { font-size: 12px; }
.caret { font-size: 18px; margin-left: 8px; }
.stepper { display: flex; align-items: center; gap: 10px; border: 3px solid var(--ink); border-radius: 14px; padding: 2px 10px; font: 700 20px Fredoka; background: #fff; }
.gain { display: flex; gap: 5px; }
.actions { display: flex; gap: 10px; margin-top: auto; }
.btn { border: 4px solid var(--ink); border-radius: 16px; font: 700 22px Fredoka; color: #fff; -webkit-text-stroke: 1px var(--ink); padding: 6px 22px; box-shadow: inset 0 -5px 0 rgba(0,0,0,.18); }
.btn.green { background: var(--green); flex: 1; }
.btn.blue { background: var(--blue); }
.btn.big { font-size: 26px; }
/* dialog */
.dlg { display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center; }
.big-lock { font-size: 64px; }
.dlg-title { font: 700 32px Fredoka; }
.dlg-text { font: 700 18px Nunito; color: #4b4560; max-width: 480px; }
.dlg-buttons { display: flex; gap: 12px; margin-top: 6px; }
</style>
</head>
<body>
<div class="head"><span class="brand">ROT SHIFT</span><span class="t" id="title"></span><div class="s" id="subtitle"></div></div>
<div class="phone"><div id="screen"></div></div>
<div class="notesbox" id="notes"></div>
<script src="ui.js"></script>
</body>
</html>
