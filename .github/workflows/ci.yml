name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache tools
        uses: actions/cache@v4
        with:
          path: .tools
          key: tools-${{ hashFiles('scripts/install-tools.sh') }}
      - name: Install tools
        run: scripts/install-tools.sh
      - name: Install packages
        run: .tools/bin/wally install
      - name: Dump Fusion API (temporary, for development)
        run: |
          find Packages -type f | sort
          for f in $(find Packages/_Index -path '*fusion*' -name '*.luau' -o -path '*fusion*' -name '*.lua' | sort); do echo "=== $f"; cat "$f"; done | head -c 400000
      - name: Lint + type-check + test
        run: scripts/check.sh
